name: CI

on:
  pull_request:
  push:
    branches:
      - "master"
    tags:
      - "*"

jobs:
  test:
    name: "Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}, Wagtail ${{ matrix.wagtail-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        wagtail-version: ["7.0", "7.4", "8.0"]
        exclude:
          # Django versions not compatible with Python <3.12
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.1"

          # Wagtail 7.0 is only compatible with Django 5.2 in this matrix
          - django-version: "6.0"
            wagtail-version: "7.0"
          - django-version: "6.1"
            wagtail-version: "7.0"

          # Wagtail 7.4 does not support Django 6.1
          - django-version: "6.1"
            wagtail-version: "7.4"

          # Wagtail 7.0 does not support Python 3.14
          - python-version: "3.14"
            wagtail-version: "7.0"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade flit
          flit install --deps=all
      - name: Install specific dependencies
        run: pip install -U Django==${{ matrix.django-version }} Wagtail==${{ matrix.wagtail-version }}
      - name: Run tests
        run: |
          coverage run -m manage test
          coverage report
      - name: Format
        run: ruff format --check lite_youtube_embed tests
      - name: Lint
        run: ruff check lite_youtube_embed tests

  package:
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: python -m pip install --upgrade flit
    - name: Build package
      run: flit build
    - name: Publish to PyPi
      if: ${{ github.ref_type == 'tag' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print_hash: true
